services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: "no"
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # Code node com retentativas ao Ollama pode passar de 300s por bloco
      - N8N_RUNNERS_TASK_TIMEOUT=1800
      # Nós de arquivo só enxergam /data (PDFs de entrada e resultados)
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - n8n_data:/home/node/.n8n
      - ./planos:/data/planos:ro
      - ./resultados:/data/resultados
    depends_on:
      - ollama
    networks:
      - tc-network

  ollama:
    image: ollama/ollama
    restart: "no"
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      # Cache KV menor: qwen2.5:7b + ctx 8192 cabe na GPU de 6 GB (~30% mais rápido medido)
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
    networks:
      - tc-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  n8n_data:
  ollama_data:

networks:
  tc-network:
    driver: bridge
